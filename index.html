	<script>
		window.onload = function () {
			document.body.classList.remove('is-preload');
		}
		window.ontouchmove = function () {
			return false;
		}
		window.onorientationchange = function () {
			document.body.scrollTop = 0;
		}

		// Current year in footer
		document.getElementById('year').textContent = new Date().getFullYear();

		// Typing effect for roles
		(function () {
			var roles = ['SAP ABAP Consultant', 'Web Developer', 'IT Enthusiast'];
			var el = document.getElementById('typed');
			var roleIndex = 0, charIndex = roles[0].length, deleting = true;

			if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
				el.textContent = roles.join(' • ');
				document.querySelector('.typed-cursor').style.display = 'none';
				return;
			}

			function tick() {
				var word = roles[roleIndex];
				if (deleting) {
					charIndex--;
					el.textContent = word.substring(0, charIndex);
					if (charIndex === 0) {
						deleting = false;
						roleIndex = (roleIndex + 1) % roles.length;
						setTimeout(tick, 400);
						return;
					}
					setTimeout(tick, 40);
				} else {
					charIndex++;
					el.textContent = roles[roleIndex].substring(0, charIndex);
					if (charIndex === roles[roleIndex].length) {
						deleting = true;
						setTimeout(tick, 2200);
						return;
					}
					setTimeout(tick, 90);
				}
			}
			setTimeout(tick, 3500);
		})();

		// Gentle snowfall to match the icefields background
		(function () {
			if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
			var container = document.getElementById('snow');
			var count = window.innerWidth < 737 ? 25 : 50;
			for (var i = 0; i < count; i++) {
				var flake = document.createElement('span');
				flake.className = 'flake';
				var size = (Math.random() * 3 + 1.5).toFixed(1);
				flake.style.width = size + 'px';
				flake.style.height = size + 'px';
				flake.style.left = (Math.random() * 100).toFixed(2) + 'vw';
				flake.style.animationDuration = (Math.random() * 10 + 8).toFixed(1) + 's';
				flake.style.animationDelay = (Math.random() * 12).toFixed(1) + 's';
				container.appendChild(flake);
			}
		})();
	</script>
